<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>App điểm danh ITALY SPORT</title>
<style>html,body{margin:0;height:100%;background:#fff}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}#cuu{position:fixed;left:8px;right:8px;bottom:8px;z-index:9;background:#123524;color:#fff;border-radius:10px;padding:10px 12px;font:14px system-ui,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25)}#cuu.an{display:none}#cuu button{margin:8px 6px 0 0;padding:8px 12px;border:0;border-radius:7px;font-size:14px;font-weight:600}#cuu .x{float:right;background:none;color:#cfe3d5;padding:0 4px;margin:0}</style>
</head><body>
<!-- 31/10/2026: mo app NGAY TRONG trang nay (iframe), khong chuyen sang script.google.com.
Dien thoai dang dang nhap nhieu tai khoan Google bi Google bao "Khong the mo tep" khi mo thang link /exec.
11/11/2026: trang nay GIU HO phien dang nhap (cong_app_IS) vi dien thoai hay xoa bo nho cua khung app.
Mo lai trang ma khong co #tk thi tu gan phien da luu -> khong phai dang nhap lai. App bao phien moi/dang xuat qua postMessage. -->
<iframe id="f" title="App điểm danh ITALY SPORT" allow="camera;geolocation"></iframe>
<!-- 17/11/2026: man hinh trang (Coach 4YOU YG40 bao 17:02). Sau 15 giay chua nhan tin nao tu app trong khung thi hien thanh cuu: Tai lai / Mo thang app. App gui tin (dang nhap, mo lai) thi an. -->
<div id="cuu" class="an"><button class="x" onclick="this.parentNode.classList.add('an')">✕</button>Màn hình trắng, không thấy gì?<br><button onclick="location.reload()">Tải lại</button><button id="cuuMo">Mở thẳng app</button></div>
<script>
var K='cong_app_IS', G='https://script.google.com/macros/s/AKfycbyb64_VRcWGrbqHN7wYlB_N8vJOdom6qzvXUZKvf3bBlgJkDe2xO9THfWkDHVugj2It/exec', Q='';
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(x){} return null; }
var h=location.hash, m=/(?:^#|&)tk=([^&]+)/.exec(h);
if(m){ ls(K, decodeURIComponent(m[1])); try{ history.replaceState(null,'',location.pathname+location.search); }catch(x){} }
else { var t=ls(K); if(t) h=(h&&h!=='#'?h+'&':'#')+'tk='+encodeURIComponent(t); }
window.addEventListener('message', function(ev){
  var o=''; try{ o=new URL(ev.origin).hostname; }catch(x){}
  if(!/\.googleusercontent\.com$/.test(o)) return;
  daCoTin=1; document.getElementById('cuu').classList.add('an');
  var d=ev.data; if(!d || typeof d.ddTk!=='string') return;
  ls(K, d.ddTk || null);
});
var s=location.search;
document.getElementById('f').src = G + (Q ? Q+(s?'&'+s.slice(1):'') : s) + h;
var daCoTin=0;
document.getElementById('cuuMo').onclick=function(){ location.href=document.getElementById('f').src; };
setTimeout(function(){ if(!daCoTin) document.getElementById('cuu').classList.remove('an'); }, 15000);
</script>
</body></html>
