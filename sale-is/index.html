<!doctype html>
<html lang="vi"><head><meta charset="utf-8">

<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f5f8;color:#18202b;padding-bottom:76px}
header{position:sticky;top:0;z-index:5;background:#0b3d91;color:#fff;padding:10px 14px}
header .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{font-size:17px}header small{opacity:.85}
.seg{display:flex;gap:6px;margin-top:8px}.seg button{flex:1;padding:7px;border:0;border-radius:8px;background:rgba(255,255,255,.18);color:#fff;font-weight:600}.seg button.on{background:#fff;color:#0b3d91}
.banner{background:#fff3cd;color:#7a5b00;padding:8px 14px;font-size:13px;border-bottom:1px solid #f0d98a}
main{padding:12px;max-width:640px;margin:0 auto}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.chip{background:#fff;border-radius:12px;padding:10px 6px;text-align:center;box-shadow:0 1px 2px #0001;cursor:pointer;border:2px solid transparent}.chip.on{border-color:#0b3d91;background:#e8efff}.chip.zero b{color:#99a}
.chip b{display:block;font-size:22px;color:#0b3d91}.chip span{font-size:12px;color:#556}
h3{margin:16px 2px 6px;font-size:15px;display:flex;justify-content:space-between}

.card{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 2px #0001}
.card .t{display:flex;justify-content:space-between;gap:8px}.card .n{font-weight:700}
.tag{display:inline-block;background:#e8efff;color:#0b3d91;border-radius:6px;padding:1px 7px;font-size:12px;margin-top:3px}
.tag.red{background:#ffe6e3;color:#a1261b}.tag.grn{background:#e2f6e8;color:#14703a}
.sub{color:#556;font-size:13px;margin-top:2px}.note{color:#667;font-size:12px;margin-top:4px;white-space:pre-wrap}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.btns>*{min-width:28%}
.btns a,.btns button,.btn{flex:1;text-align:center;padding:9px 6px;border-radius:9px;border:1px solid #cfd6e2;background:#fff;color:#0b3d91;font-weight:600;text-decoration:none;font-size:14px}
.btn.pri,.btns .pri{background:#0b3d91;color:#fff;border-color:#0b3d91}
.empty{color:#778;text-align:center;padding:10px;font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #dde;display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:12px 2px;border:0;background:none;font-weight:600;color:#667;font-size:13px;white-space:nowrap}nav button.on{color:#0b3d91;border-top:3px solid #0b3d91;margin-top:-1px}
label{display:block;font-size:13px;color:#445;margin:10px 0 3px}
input,select,textarea{width:100%;max-width:100%;box-sizing:border-box;padding:10px;border:1px solid #cfd6e2;border-radius:9px;font:inherit;background:#fff}
input[type=date]{-webkit-appearance:none;appearance:none;min-height:44px;display:block}
.btnThu{width:100%;margin:8px 0 4px;padding:13px;border:0;border-radius:11px;background:#e8a400;color:#fff;font:inherit;font-weight:800;font-size:16px}
textarea{min-height:64px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end}
.sheet>div{background:#f3f5f8;border-radius:16px 16px 0 0;width:100%;max-height:92vh;overflow:auto;padding:14px;max-width:640px;margin:0 auto}
.err{background:#ffe6e3;color:#8c1d14;border-radius:9px;padding:8px 10px;margin:8px 0;font-size:13px}
.ok{background:#e2f6e8;color:#14703a;border-radius:9px;padding:8px 10px;margin:8px 0;font-size:13px}
.login{max-width:340px;margin:12vh auto;padding:0 16px}.login h2{color:#0b3d91}
.locs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin-bottom:2px}.locs button{flex:none;padding:7px 12px;border-radius:18px;border:1px solid #cfd6e2;background:#fff;color:#334;font-weight:600;font-size:13px}.locs button.on{background:#0b3d91;border-color:#0b3d91;color:#fff}
.hide{display:none}.goiy{background:#fff;border:1px solid #cfd6e2;border-radius:9px;margin-top:4px}.goiy div{padding:9px 10px;border-bottom:1px solid #eef}.goiy div:last-child{border:0}
.tag.org{background:#fff1d6;color:#8a5a00}.spin{text-align:center;padding:30px;color:#667}
</style></head><body>
<div id="app"></div>
<script>/* APP SALE ITALY + 4YOU - loi xu ly (thuan, khong goi Sheet). Chay duoc trong Apps Script va Node.
   Du lieu vao: mang 2 chieu nhu Sheet tra ve (dong 0 = tieu de). So dong Sheet = chi so + 1.
   Nguyen tac: tim cot theo TEN tieu de; chi them dong / sua dung o can sua; o co chu khong bi xoa trang. */
var Core = (function () {
  var C = {};

  // ---------- cau hinh theo thuong hieu ----------
  C.BRANDS = {
    IS: {
      ten: 'ITALY SPORT',
      data: { name: 'HỌ VÀ TÊN', dob: 'NGÀY SINH', cls: 'LỚP', school: 'TÊN TRƯỜNG HỌC', phone: 'SỐ ĐIỆN THOẠI', base: 'CƠ SỞ',
        note: 'NOTE', trial: ['NGÀY HỌC THỬ 1', 'NGÀY HỌC THỬ 2', 'NGÀY HỌC THỬ 3'], sale: 'SALE', care: 'NGÀY CHĂM SÓC',
        call: 'NGÀY GỌI', contact: 'TÌNH TRẠNG LIÊN HỆ', close: 'CHỐT SALE', trialSt: 'TÌNH TRẠNG HỌC THỬ', reason: 'LÝ DO TỪ CHỐI',
        amount: 'SỐ TIỀN', payMethod: 'HÌNH THỨC NHẬN TIỀN', payDate: 'NGÀY NHẬN TIỀN', source: 'NGUỒN', form: 'HÌNH THỨC HỌC' },
      reten: { name: 'TÊN HỌC SINH', phone: 'SĐT LIÊN HỆ', base: 'CƠ SỞ', course: 'KHÓA HỌC', end: 'NGÀY KẾT THÚC',
        endExt: 'NGÀY KẾT THÚC SAU KHI GIA HẠN', sale: 'SALE GỌI', close: 'CHỐT SALE', status: 'TÌNH TRẠNG HỌC VIÊN', care: 'NGÀY GỌI CHĂM SÓC',
        note: 'NOTE', firstCall: 'NGÀY GỌI ĐẦU TIÊN', contact: 'TÌNH TRẠNG LIÊN HỆ', form: 'HÌNH THỨC HỌC', reason: 'LÝ DO KHÔNG RETENTION', amount: 'SỐ TIỀN', payMethod: 'HÌNH THỨC NHẬN TIỀN', payDate: 'NGÀY NHẬN TIỀN' },
      misc: { base: 'Sân', sale: 'Sales', contact: 'Tình trạng liên hệ', close: 'Tình trạng chốt sale', trialSt: 'Tình trạng học viên',
        reason: 'Lý do không đi học nữa', payMethod: 'Hình thức nhận tiền', source: 'Nguồn', cls: 'LỚP' }
    },
    '4Y': {
      ten: '4YOU SPORT',
      data: { name: 'HỌ VÀ TÊN', dob: 'NGÀY SINH', cls: 'LỚP', school: 'TRƯỜNG HỌC', phone: 'SỐ ĐIỆN THOẠI', base: 'CƠ SỞ',
        note: 'NOTE', trial: ['NGÀY HỌC THỬ'], sale: 'SALE', care: 'NGÀY GỌI CHĂM SÓC',
        call: 'NGÀY GỌI', contact: 'TÌNH TRẠNG LIÊN HỆ', close: 'CHỐT SALE', trialSt: 'TÌNH TRẠNG HỌC THỬ', reason: 'LÝ DO KHÔNG ĐI HỌC',
        amount: 'SỐ TIỀN', payMethod: 'HÌNH THỨC NHẬN TIỀN', payDate: 'NGÀY NHẬN TIỀN', source: 'Nguồn', form: 'HÌNH THỨC HỌC' },
      reten: { name: 'TÊN HỌC SINH', phone: 'SĐT LIÊN HỆ', base: 'CƠ SỞ', course: 'KHÓA HỌC', end: 'NGÀY KẾT THÚC',
        endExt: 'NGÀY KẾT THÚC SAU KHI GIA HẠN', sale: 'SALE GỌI', close: 'CHỐT SALE', status: 'TÌNH TRẠNG HỌC VIÊN', care: 'NGÀY GỌI CHĂM SÓC',
        note: 'NOTE', firstCall: 'NGÀY GỌI ĐẦU TIÊN', contact: 'TÌNH TRẠNG LIÊN HỆ', form: 'HÌNH THỨC HỌC', reason: 'LÝ DO KHÔNG RETENTION', amount: 'SỐ TIỀN', payMethod: 'HÌNH THỨC NHẬN TIỀN', payDate: 'NGÀY NHẬN TIỀN' },
      misc: { base: 'Cơ sở', sale: 'Sales', contact: 'Tình trạng liên hệ', close: 'Tình trạng chốt sale', trialSt: 'Tình trạng học viên',
        reason: 'Lý do không đi học nữa', payMethod: 'Hình thức nhận tiền', source: 'Nguồn', cls: 'LỚP' }
    }
  };
  // Quy tac ngay (nghiep vu)
  C.RULES = { canGoiLaiNgay: 3, hocThuChuaChotNgay: 14, taiTucTruoc: 14, taiTucQuaHan: 7, toiDaMoiMuc: 40 };
  var DONE_CLOSE = 'đã thành công', FAIL_CLOSE = 'không thành công';

  // ---------- tien ich ----------
  function N(s) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim().toUpperCase(); }
  function T(s) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim(); }
  function noDau(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase().replace(/\s+/g, ' ').trim(); }
  C.N = N; C.noDau = noDau;

  function norm1(d) {
    if (d.indexOf('84') === 0 && d.length === 11) d = '0' + d.slice(2);
    if (d.length === 9 && d.charAt(0) !== '0') d = '0' + d;
    return d;
  }
  // 05/11/2026: 1 o co the ghi nhieu so ("0978.. mẹ\n0976.. bố") -> tach tung so, giu nhan bố/mẹ/zalo
  C.phones = function (s) {
    var out = [], seen = {};
    String(s == null ? '' : s).split(/[\n;,\/]+|\s-\s/).forEach(function (seg) {
      var d = norm1(seg.replace(/\D/g, ''));
      if (!/^0\d{9}$/.test(d) || seen[d]) return;
      seen[d] = 1;
      var t = seg.toLowerCase(), nhan = /zalo/.test(t) ? 'Zalo' : /b[oố]/.test(t) && /(^|\W)b[oố]/.test(t) ? 'bố' : /m[eẹ]|mej/.test(t) ? 'mẹ' : '';
      out.push({ sdt: d, nhan: nhan });
    });
    out.sort(function (a, b) { return (b.nhan === 'Zalo') - (a.nhan === 'Zalo'); });
    return out;
  };
  C.normPhone = function (s) {
    var d = norm1(String(s == null ? '' : s).replace(/\D/g, ''));
    if (/^0\d{9}$/.test(d)) return d;
    var p = C.phones(s);
    return p.length ? p[0].sdt : d;
  };
  C.phoneOk = function (s) { return /^0\d{9}$/.test(C.normPhone(s)); };

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  // tra ve {y,m,d} hoac null. Chap nhan dd/mm/yyyy, dd/mm/yy, dd/mm (lay nam mac dinh), yyyy-mm-dd
  C.parseDate = function (s, defYear) {
    s = T(s); if (!s) return null;
    var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return chk(+m[1], +m[2], +m[3]);
    m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?(?!\d)/);
    if (!m) return null;
    var y = m[3] ? +m[3] : defYear; if (!y) return null;
    if (y < 100) y += 2000;
    return chk(y, +m[2], +m[1]);
  };
  function chk(y, mo, d) {
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    var dt = new Date(Date.UTC(y, mo - 1, d));
    if (dt.getUTCMonth() !== mo - 1) return null;
    return { y: y, m: mo, d: d };
  }
  C.dayNum = function (o) { return o ? Math.round(Date.UTC(o.y, o.m - 1, o.d) / 864e5) : null; };
  C.fmtDate = function (o) { return o ? pad(o.d) + '/' + pad(o.m) + '/' + o.y : ''; };
  C.addDays = function (o, n) { var t = new Date(Date.UTC(o.y, o.m - 1, o.d) + n * 864e5); return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate() }; };
  C.todayObj = function (str) { return C.parseDate(str); };

  C.header = function (row) {
    var h = {};
    (row || []).forEach(function (x, i) { var k = N(x); if (k && h[k] == null) h[k] = i; });
    return h;
  };
  function col(h, name) { var v = h[N(name)]; return v == null ? -1 : v; }
  function raw(r, i) { return i < 0 || i >= r.length || r[i] == null ? '' : String(r[i]); }  // giu xuong dong (o nhieu SDT)
  function cell(r, i) { return i < 0 || i >= r.length || r[i] == null ? '' : T(r[i]); }
  C.checkHeaders = function (rows, spec) {
    var h = C.header(rows[0]), miss = [];
    Object.keys(spec).forEach(function (k) {
      [].concat(spec[k]).forEach(function (nm) { if (nm && h[N(nm)] == null) miss.push(nm); });
    });
    return miss;
  };

  // ---------- nguoi dung / phan quyen ----------
  // user = {ten, saleName, leader:boolean}. Sale chi thay dong co cot SALE trung ten minh; lanh dao thay het.
  C.sameSale = function (a, b) { return noDau(a) !== '' && noDau(a) === noDau(b); };
  function canSee(user, saleCell) { return user.leader || C.sameSale(user.saleName, saleCell); }
  C.canTouch = function (user, saleCell) {
    if (user.leader) return true;
    if (T(saleCell) === '') return true; // dong chua co sale: sale nao cung nhan duoc
    return C.sameSale(user.saleName, saleCell);
  };

  // ---------- doc dong thanh doi tuong ----------
  function rowObj(cfg, h, r, idx) {
    var d = cfg.data, trials = [];
    d.trial.forEach(function (n) { var v = cell(r, col(h, n)); if (v) trials.push(v); });
    return {
      row: idx + 1, ten: cell(r, col(h, d.name)), sdt: C.normPhone(raw(r, col(h, d.phone))), sdtGoc: raw(r, col(h, d.phone)),
      coSo: cell(r, col(h, d.base)), sale: cell(r, col(h, d.sale)), note: cell(r, col(h, d.note)),
      lienHe: cell(r, col(h, d.contact)), chot: cell(r, col(h, d.close)), hocThu: cell(r, col(h, d.trialSt)),
      ngayGoi: cell(r, col(h, d.call)), ngayCham: cell(r, col(h, d.care)), ngaySinh: cell(r, col(h, d.dob)),
      lop: cell(r, col(h, d.cls)), truong: cell(r, col(h, d.school)), lyDo: cell(r, col(h, d.reason)),
      soTien: cell(r, col(h, d.amount)), ngayHocThu: trials
    };
  }
  function lastTrial(o, year) {
    var best = null;
    o.ngayHocThu.forEach(function (s) { var p = C.parseDate(s, year); if (p && (!best || C.dayNum(p) > C.dayNum(best))) best = p; });
    return best;
  }

  // ---------- MAN HINH HOM NAY ----------
  // data/reten: mang 2 chieu. today: 'dd/mm/yyyy'
  C.homNay = function (brand, data, reten, user, today) {
    var cfg = C.BRANDS[brand], R = C.RULES, td = C.parseDate(today), tn = C.dayNum(td), yr = td.y;
    var out = { brand: brand, ten: cfg.ten, ngay: C.fmtDate(td), hocThuHomNay: [], hocThuNgayMai: [], canGoi: [], hocThuChuaChot: [], taiTuc: [], dem: {}, canhBao: [] };
    var d = cfg.data;
    if (data && data.length) {
      var miss = C.checkHeaders(data, { a: [d.phone, d.sale, d.close, d.trialSt] });
      if (miss.length) out.canhBao.push('File 1.26 thiếu cột: ' + miss.join(', '));
      var h = C.header(data[0]);
      for (var i = 1; i < data.length; i++) {
        var r = data[i];
        if (cell(r, col(h, d.phone)) === '' && cell(r, col(h, d.name)) === '') continue;
        var saleCell = cell(r, col(h, d.sale));
        if (!canSee(user, saleCell)) continue;
        var o = rowObj(cfg, h, r, i), st = N(o.hocThu), cl = N(o.chot), lh = N(o.lienHe);
        var closed = cl === N(DONE_CLOSE) || cl === N(FAIL_CLOSE);
        // hoc thu hom nay / ngay mai
        var hasToday = false, hasTomorrow = false;
        o.ngayHocThu.forEach(function (s) {
          var p = C.parseDate(s, yr); if (!p) return;
          var dn = C.dayNum(p);
          if (dn === tn) hasToday = true; else if (dn === tn + 1) hasTomorrow = true;
        });
        var daHoc = st === N('Đã học thử');
        if (hasToday && !closed) out.hocThuHomNay.push(slim(o, 'Học thử hôm nay'));
        else if (hasTomorrow && !closed && !daHoc) out.hocThuNgayMai.push(slim(o, 'Học thử ngày mai'));
        // hoc thu xong chua chot
        var inCC = false;
        if (daHoc && !closed) {
          var lt = lastTrial(o, yr);
          var age = lt ? tn - C.dayNum(lt) : null;
          if (age == null || (age >= 0 && age <= R.hocThuChuaChotNgay)) { inCC = true; out.hocThuChuaChot.push(slim(o, lt ? 'Học thử ' + C.fmtDate(lt) + ', chưa chốt' : 'Đã học thử, chưa chốt')); }
        }
        // can goi: chua goi lan nao, hoac dang xem xet / chua lien he duoc ma da qua han goi lai
        if (!closed && !hasToday && !inCC) {
          var lastCall = latest([C.parseDate(o.ngayGoi, yr), C.parseDate(o.ngayCham, yr)]);
          if (lh === '' && o.ngayGoi === '' && o.ngayCham === '') out.canGoi.push(slim(o, 'Khách mới, chưa gọi'));
          else if (lh.indexOf('CHƯA LIÊN HỆ ĐƯỢC') === 0 || cl.indexOf('ĐANG XEM XÉT') === 0 || cl.indexOf('ĐANG ĐỢI') === 0) {
            var gap = lastCall ? tn - C.dayNum(lastCall) : 999;
            if (gap >= R.canGoiLaiNgay) out.canGoi.push(slim(o, (lh.indexOf('CHƯA LIÊN HỆ') === 0 ? 'Chưa liên hệ được' : 'Đang xem xét') + (lastCall ? ', gọi lần cuối ' + gap + ' ngày trước' : ', chưa có ngày gọi')));
          }
        }
      }
    }
    // tai tuc: theo NGAY KET THUC SAU KHI GIA HAN, trong thi moi lay ngay ket thuc goc
    if (reten && reten.length) {
      var rc = cfg.reten, hr = C.header(reten[0]);
      var miss2 = C.checkHeaders(reten, { a: [rc.endExt, rc.end, rc.sale, rc.close] });
      if (miss2.length) out.canhBao.push('File 3.26 thiếu cột: ' + miss2.join(', '));
      var sauChot = {}; // 06/11/2026: hoc sinh da co dong tai ki thanh cong phia duoi -> dong cu khong can goi nua
      for (var j0 = reten.length - 1; j0 >= 1; j0--) { var q0 = reten[j0]; if (N(cell(q0, col(hr, rc.close))) !== N(DONE_CLOSE)) continue; var k0 = noDau(cell(q0, col(hr, rc.name))) + '|' + C.normPhone(raw(q0, col(hr, rc.phone))); if (!(k0 in sauChot)) sauChot[k0] = j0; }
      for (var j = 1; j < reten.length; j++) {
        var q = reten[j], kq = noDau(cell(q, col(hr, rc.name))) + '|' + C.normPhone(raw(q, col(hr, rc.phone)));
        if (sauChot[kq] > j) continue;
        if (cell(q, col(hr, rc.name)) === '' && cell(q, col(hr, rc.phone)) === '') continue;
        var sc = cell(q, col(hr, rc.sale));
        if (!canSee(user, sc)) continue;
        var cl2 = N(cell(q, col(hr, rc.close))), stt = N(cell(q, col(hr, rc.status)));
        if (cl2 === N(DONE_CLOSE) || stt === N('Tái đăng kí') || stt === N('Tái đăng ký') || stt === N('Nghỉ luôn')) continue;
        var hanStr = cell(q, col(hr, rc.endExt)) || cell(q, col(hr, rc.end));
        var han = C.parseDate(hanStr, yr); if (!han) continue;
        var left = C.dayNum(han) - tn;
        if (left > R.taiTucTruoc || left < -R.taiTucQuaHan) continue;
        out.taiTuc.push(ttObj(rc, hr, q, j, han, left, sc));
      }
      out.taiTuc.sort(function (a, b) { return a.conLai - b.conLai; });
    }
    // sap xep: dong moi (so dong lon) len truoc voi khach can goi
    out.canGoi.sort(function (a, b) { return b.row - a.row; });
    out.hocThuChuaChot.sort(function (a, b) { return b.row - a.row; });
    out.dem = { hocThuHomNay: out.hocThuHomNay.length, hocThuNgayMai: out.hocThuNgayMai.length, canGoi: out.canGoi.length, hocThuChuaChot: out.hocThuChuaChot.length, taiTuc: out.taiTuc.length };
    ['hocThuHomNay', 'hocThuNgayMai', 'canGoi', 'hocThuChuaChot', 'taiTuc'].forEach(function (k) { if (out[k].length > R.toiDaMoiMuc) out[k] = out[k].slice(0, R.toiDaMoiMuc); });
    return out;
  };
  // 1 dong file 3.26 -> the tai tuc (dung chung cho danh sach Hom nay va o tim kiem)
  function ttObj(rc, hr, q, j, han, left, sc) {

    '<div class="sub">' + esc(p.ngay) + ' · <b>' + Core.tien(p.soTien) + 'đ</b> · ' + esc(p.khoa) + '</div><div class="sub">' + esc(p.sdt) + (p.nguoiLap ? ' · lập: ' + esc(p.nguoiLap) : '') + '</div>' +
    '<div class="btns"><button onclick="moPhieu(st.kho[' + i + '].phieu)">Xem / gửi lại</button><button class="pri" onclick="openSua(' + i + ')">Sửa phiếu</button></div></div>'; }).join('');
  if (l.length) out += '<h3>Chỉ lưu trên máy này<em>' + l.length + '</em></h3><div class="sub" style="margin:0 2px 6px">Phiếu lập trước khi có kho (trước 06/11), chỉ xem lại được. Cần sửa thì báo quản lý.</div>' +
    l.map(function (p) { var j = dsPhieu().indexOf(dsPhieu().filter(function (x) { return x.so === p.so; })[0]); return '<div class="card"><div class="t"><span class="n">' + esc(p.ten) + '</span><span class="sub">' + esc(p.so) + '</span></div><div class="sub">' + esc(p.ngay) + ' · ' + Core.tien(p.soTien) + 'đ · ' + esc(p.khoa) + '</div><div class="btns"><button onclick="moPhieu(dsPhieu()[' + j + '])">Xem / gửi lại</button></div></div>'; }).join('');
  if (!out) out = '<div class="empty">' + (st.kho ? (q ? 'Không thấy phiếu khớp' : 'Chưa có phiếu nào') : (st.thu && !DEMO ? 'Chế độ thử không có kho phiếu' : 'Đang tải...')) + '</div>';
  if (q.length >= 2) out += '<div class="card" style="background:#f3f7ff"><div class="sub">Tab này chỉ chứa phiếu <b>đã lập</b>. Muốn <b>lập phiếu mới</b> cho học sinh: tìm học sinh ở tab Khách rồi bấm Chốt - thu tiền.</div><div class="btns"><button class="pri" onclick="timKhachTuPhieu()">Tìm \u201c' + esc(q) + '\u201d ở tab Khách</button></div></div>';
  return out;
}
function openSua(i) {
  var r = st.kho[i]; if (!r) return; var p = r.phieu, f = r.f || {}, t = r.tien || {}, o = st.opt;
  var ov = document.createElement('div'); ov.className = 'sheet'; ov.id = 'ov';
  var tienHtml = '<div class="row2"><div><label>' + (p.giai ? 'Lệ phí' : 'Học phí thu') + ' *</label><input id="sp_st" class="tien" inputmode="numeric" data-tay="1" oninput="tongPT(\'sp\')"></div><div><label>Hình thức *</label>' + sel('sp_hinh', o.payMethod, '') + '</div></div><label>Ngày nhận tiền *</label><input id="sp_nt" class="ngay" inputmode="numeric" placeholder="ngày/tháng/năm" maxlength="10" autocomplete="off">';
  ov.innerHTML = '<div><h3 style="margin-top:0">Sửa phiếu ' + esc(p.so) + '<em>' + Core.tien(p.soTien) + 'đ</em></h3><div class="sub">' + esc(p.ten) + ' · ' + esc(p.sdt) + ' · ' + esc(p.loai) + '</div>' +
    '<div class="note">Sửa xong app vẽ lại phiếu <b>cùng số</b>, gửi lại phụ huynh. Dòng danh sách đăng kí chỉ tự sửa khi HCNS chưa xác nhận; đã xác nhận thì app báo để HCNS sửa tay.</div>' +
    (p.giai ? '<label>Giải / sự kiện</label><input value="' + esc(p.khoa) + '" disabled>' + tienHtml + nlHtml('sp') + '<label>Ghi chú (in lên phiếu)</label><textarea id="sp_gc" rows="2"></textarea>'
      : dkHtml('sp', f.khoaHoc, tienHtml)) +
    '<div id="spe"></div><div class="btns"><button onclick="closeUpd()">Đóng</button><button class="pri" onclick="saveSua(' + i + ')">Lưu và vẽ lại phiếu</button></div></div>';
  document.body.appendChild(ov);
  var v = function (id, x) { var e = $('#' + id); if (e && x != null && x !== '') e.value = x; };
  v('sp_st', t.soTien ? Core.tien(Core.soTien(t.soTien)) : ''); v('sp_nt', dmy(t.ngayTien)); v('sp_gc', f.ghiChu);
  var hs = $('#sp_hinh'); if (hs && t.hinhThucTien) { var co = [].some.call(hs.options, function (x) { return Core.N(x.value) === Core.N(t.hinhThucTien) && (hs.value = x.value); }); if (!co) { var op = document.createElement('option'); op.textContent = t.hinhThucTien; hs.appendChild(op); hs.value = t.hinhThucTien; } }
  var nl = $('#sp_nl'); if (nl && f.nguoiLap) { if (nl.tagName === 'SELECT' && ![].some.call(nl.options, function (x) { return x.value === f.nguoiLap; })) { var o2 = document.createElement('option'); o2.textContent = f.nguoiLap; nl.appendChild(o2); } nl.value = f.nguoiLap; }
  if (!p.giai) {
    v('sp_bd', dmy(f.ngayBatDau)); v('sp_kt', dmy(f.ngayKetThuc) || dmy(p.ketThuc)); if ($('#sp_kt')) $('#sp_kt').dataset.tay = 1;
    v('sp_ct', f.conThieu); v('sp_hc', f.hpChuyen); v('sp_sz', f.size); v('sp_kt2', f.khacTen); v('sp_kt3', f.khacTien); v('sp_lh', f.lich);
    Object.keys(f.do || {}).forEach(function (k) { v('sp_do_' + k, f.do[k]); });
    if (!f.do && f.dongPhuc) v('sp_do_dongPhuc', f.dongPhuc);
    var ks = $('#sp_khs'); if (ks && !ks.value && f.khoaHoc) { ks.value = '__khac'; $('#sp_kh').className = ''; $('#sp_kh').value = f.khoaHoc; }
  }
  tongPT('sp');
}
function saveSua(i) {
  var r = st.kho[i], g = function (id) { var e = $('#' + id); return e ? e.value.trim() : ''; };
  var tien = { soTien: g('sp_st'), ngayTien: dmy(g('sp_nt')), hinhThucTien: g('sp_hinh') };
  var f = r.phieu.giai ? { khoaHoc: r.f && r.f.khoaHoc || r.phieu.khoa, nguoiLap: g('sp_nl').replace(/\s+/g, ' '), ghiChu: g('sp_gc') } : dkGet('sp');
  $('#spe').innerHTML = '<div class="spin">Đang lưu...</div>';
  call({ act: 'suaPhieu', so: r.so, tien: tien, f: f }).then(function (x) {
    if (!x.ok) { $('#spe').innerHTML = x.loi.map(function (e) { return '<div class="err">' + esc(e) + '</div>'; }).join(''); return; }
    r.phieu = x.phieu; r.f = f; r.tien = tien; r.suaLan = x.phieu.suaLan; luuPhieu(x.phieu); if ($('#pkq')) $('#pkq').innerHTML = pkqList();
    moPhieu(x.phieu, x.canhBao, false);
  }).catch(function (e) { $('#spe').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
}

// ---------- DANG KY GIAI / SU KIEN (ghi tab DATA SU KIEN file 1.26 + lap phieu thu) ----------
function giaiView() {
  var o = st.opt, g = o.giai || { ds: [] }, lead = st.me.brands[st.brand].leader;
  return '<h3 style="margin-top:0">Đăng ký giải / sự kiện</h3>' +
    '<div class="sub">App ghi 1 dòng vào tab DATA SỰ KIỆN (tên giải ở cột CƠ SỞ như team vẫn ghi) và lập phiếu thu để gửi phụ huynh.</div>' +
    '<label>Tìm học sinh có sẵn để điền nhanh</label><input id="g_q" placeholder="tên bé hoặc SĐT" autocomplete="off" oninput="onGq(this.value)"><div id="g_goi"></div>' +
    '<label>Tên bé *</label><input id="g_ten"><div class="row2"><div><label>Ngày sinh</label><input id="g_ns" class="ngay" inputmode="numeric" placeholder="ngày/tháng/năm" maxlength="10" autocomplete="off"></div><div><label>SĐT phụ huynh *</label><input id="g_sdt" inputmode="tel" placeholder="09xx..."></div></div>' +
    '<div class="row2"><div><label>Trường</label><input id="g_truong"></div><div><label>Lớp</label>' + sel('g_lop', o.lop, '') + '</div></div>' +
    '<label>Giải / sự kiện *</label><select id="g_gs" onchange="giaiChon()"><option value="">- chọn giải -</option>' + (g.ds || []).map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('') + '<option value="__khac">Giải khác (tự gõ)...</option></select>' +
    '<input id="g_giai" class="hide" style="margin-top:6px" placeholder="vd JR CUP 2026">' +
    '<label>Nguồn</label><input id="g_nguon" placeholder="vd Học viên, Fanpage">' +
    '<div class="row2"><div><label>Lệ phí *</label><input id="g_st" class="tien" inputmode="numeric" oninput="this.dataset.tay=1"></div><div><label>Hình thức *</label>' + sel('g_hinh', o.payMethod || g.payMethod, '') + '</div></div><div class="sub" id="g_gia"></div>' +
    '<label>Ngày nhận tiền *</label><input id="g_nt" class="ngay" inputmode="numeric" placeholder="ngày/tháng/năm" maxlength="10" autocomplete="off" value="' + homNgay() + '">' +
    (lead ? '<label>Sale phụ trách *</label>' + sel('g_sale', o.sale, st.loc || '') : '') +
    nlHtml('g') + '<label>Ghi chú (in lên phiếu, ghi vào NOTE)</label><textarea id="g_gc" rows="2" placeholder="vd đội U11, size áo 140"></textarea>' +
    '<div id="ge"></div><div class="btns"><button class="btn pri" onclick="saveGiai(false)">Lưu và lập phiếu thu</button></div>';
}
function giaiInit() { if (st.giaiPre) { dienGiai(st.giaiPre); st.giaiPre = null; } }
function giaiTu(row) { var x = (st.kq || []).filter(function (k) { return k.row === row; })[0]; if (!x) return; st.giaiPre = x; setTab('giai'); }
function onGq(v) {
  var b = $('#g_goi'); if (!b) return; if (!st.ds || v.trim().length < 2) { b.innerHTML = v.trim().length >= 2 && !st.ds ? '<div class="sub">Danh sách khách đang tải, thử lại sau vài giây.</div>' : ''; return; }
  var l = Core.locDs(st.ds, v, 6); st.gGoi = l;
  b.innerHTML = l.length ? '<div class="goiy">' + l.map(function (x, i) { return '<div onclick="dienGiai(st.gGoi[' + i + '])"><b>' + esc(x.ten) + '</b> <span class="sub">' + esc([x.sdt, x.lop, x.truong].filter(Boolean).join(' · ')) + '</span></div>'; }).join('') + '</div>' : '<div class="sub">Không thấy, nhập tay bên dưới.</div>';
}
function dienGiai(x) {
  var v = function (id, val) { var e = $('#' + id); if (e) e.value = val || ''; };
  v('g_ten', x.ten); v('g_sdt', x.sdt); var nd = Core.parseDate(String(x.ngaySinh || '')); v('g_ns', nd ? p2(nd.d) + '/' + p2(nd.m) + '/' + nd.y : ''); if ($('#g_ns')) $('#g_ns').placeholder = nd || !x.ngaySinh ? 'ngày/tháng/năm' : 'năm sinh ' + x.ngaySinh + ', không bắt buộc'; v('g_truong', x.truong);
  var l = $('#g_lop'); if (l && x.lop) { [].some.call(l.options, function (o) { return Core.N(o.value) === Core.N(x.lop) && (l.value = o.value); }); }
  if ($('#g_goi')) $('#g_goi').innerHTML = ''; if ($('#g_q')) $('#g_q').value = '';
}
function giaiTen() { var s = $('#g_gs'); return s && s.value && s.value !== '__khac' ? s.value : ($('#g_giai') || {}).value || ''; }
function giaiChon() {
  var s = $('#g_gs'), i = $('#g_giai'), g = st.opt.giai || {}, hp = $('#g_st'), n = $('#g_gia');
  if (s.value === '__khac') { i.className = ''; i.focus(); } else i.className = 'hide';
  var k = Core.N(giaiTen()), gia = (g.gia || {})[k], ng = (g.nguon || {})[k];
  if (gia && !hp.dataset.tay) { hp.value = Core.tien(gia); n.textContent = 'Đã tự điền lệ phí ' + Core.tien(gia) + 'đ (mức hay thu của giải này). Sai thì sửa.'; } else n.textContent = '';
  if (ng && !$('#g_nguon').value) $('#g_nguon').value = ng;
}
function saveGiai(trungOk) {
  var g = function (i) { var e = $('#' + i); return e ? e.value.trim() : ''; };
  var nl = g('g_nl').replace(/\s+/g, ' '); if (nl) { try { localStorage.setItem(hlKey(), nl); } catch (e) {} }
  var f = { ten: g('g_ten'), ngaySinh: dmy(g('g_ns')), sdt: g('g_sdt'), truong: g('g_truong'), lop: g('g_lop'), giai: giaiTen().trim(), nguon: g('g_nguon'), soTien: g('g_st'), hinhThucTien: g('g_hinh'), ngayTien: dmy(g('g_nt')), sale: g('g_sale'), nguoiLap: nl, ghiChu: g('g_gc'), chapNhanTrung: !!trungOk };
  $('#ge').innerHTML = '<div class="spin">Đang lưu...</div>';
  call({ act: 'dkGiai', f: f }).then(function (r) {
    if (!r.ok) { $('#ge').innerHTML = r.loi.map(function (e) { return '<div class="err">' + esc(e) + '</div>'; }).join('') + (r.trungGiai ? '<div class="btns"><button class="pri" onclick="saveGiai(true)">Vẫn đăng ký thêm (lần thu khác)</button></div>' : ''); return; }
    $('#ge').innerHTML = okMsg(r); st.kho = null;
    ['g_ten', 'g_ns', 'g_sdt', 'g_truong', 'g_gc'].forEach(function (i) { if ($('#' + i)) $('#' + i).value = ''; });
    if (r.phieu) { luuPhieu(r.phieu); setTimeout(function () { moPhieu(r.phieu, r.canhBao, false); }, DEMO ? 300 : 700); }
  }).catch(function (e) { $('#ge').innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
}
// ---------- khoi dong ----------
if (DEMO) demoInit();
var tk = localStorage.getItem('appsale_token');
if (tk && !DEMO) call({ act: 'me', brand: 'IS' }).then(function (r) { st.me = r.me; st.thu = r.thu; st.banSao = !!r.banSao; pickBrand(r.me); boot(); }).catch(function () { render(); });
else render();
